# Question set — 8 per council.
#
# Design rule: every question must be (a) answerable as a fact from the council's own website,
# and (b) tagged to a specific predicted failure mode. Do not add generic questions that sample
# uniformly — the point is to surface the five failure modes, not to measure average knowledge.
#
# FAILURE MODES
#   wrong_council      answer describes a different council's process, or a generic state answer
#   assumed_suburban   answer assumes a metropolitan service model that does not exist there
#   stale_figure       answer gives a superseded fee/date (fees change 1 July)
#   confabulation      thin web presence, model invents or substitutes a nearby council
#   amalgamation       model confuses pre-2008 / post-2008 / de-amalgamated 2014 entities
#   control            stable well-published fact; expected correct — this is the baseline
#
# FROZEN as of pre-registration. Do not edit after the first run.

questions:
  - id: recycling
    text: "Does {council} provide a kerbside recycling collection service, and if so which day is it collected?"
    failure_modes: [assumed_suburban, wrong_council]
    why: >
      Many remote and island communities have no kerbside recycling at all. A model that assumes
      the yellow-lid bin is universal will confidently describe a service that does not exist.
      This is a category error, not a detail error, and it is the sharpest test in the set.
    ground_truth_hint: "waste services / bin collection page"

  - id: infringement
    text: "How do I contest or seek review of a parking or local law fine issued by {council}, and what is the deadline to do so?"
    failure_modes: [wrong_council, stale_figure]
    why: >
      Review windows are short and hard. Wrong information here causes a loss the resident cannot
      undo, which is the strongest harm claim in the project. Also the most likely place to get a
      generic Queensland answer or Brisbane's process.
    ground_truth_hint: "fines / infringements / penalty notice review page"

  - id: rates_hardship
    text: "What financial hardship assistance does {council} offer to ratepayers who cannot pay their rates, and how do I apply?"
    failure_modes: [confabulation, wrong_council]
    why: >
      Deadline-bearing and consequential — unpaid rates escalate, and every state's Local
      Government Act ultimately permits sale of land for arrears. Also poorly published on most
      council sites, so expect a high `unverifiable` rate, which is itself the finding that points
      at the fix.
    ground_truth_hint: "rates / hardship / financial assistance page"

  - id: dog_fee
    text: "What is the current annual fee to register a desexed dog with {council}?"
    failure_modes: [stale_figure]
    why: >
      Fee schedules change on 1 July. Running this in August catches the window where last
      year's figure is still being served. A clean, dated, systematic error.
    ground_truth_hint: "fees and charges schedule / animal registration"

  - id: pay_rates
    text: "What are all the ways I can pay my rates to {council}?"
    failure_modes: [assumed_suburban, confabulation]
    why: >
      Tests whether the model assumes an online payment portal, direct debit and BPAY exist.
      Some small and remote councils offer far fewer channels, and in-person may be the practical
      one. Getting this wrong sends someone down a path that does not exist.
    ground_truth_hint: "rates payment options page"

  - id: waste_facility
    text: "Where is the {council} waste transfer station or landfill, and what are its opening hours?"
    failure_modes: [confabulation, wrong_council]
    why: >
      Highly local, hard to generalise, and a model with thin data will substitute the nearest
      larger centre. Easy to verify against the council page.
    ground_truth_hint: "waste facilities / transfer station / tip hours"

  - id: shed_approval
    text: "Do I need approval from {council} to build a garden shed on my property, and what does the application involve?"
    failure_modes: [wrong_council, assumed_suburban]
    why: >
      Planning rules vary by council and by zone. The model will tend to give a generic Queensland
      or national answer. Also relevant in communities where land tenure differs (Deed of Grant in
      Trust), which a generic answer will not touch at all.
    ground_truth_hint: "planning / building approvals / exempt development"

  - id: mayor
    text: "Who is the current mayor of {council}?"
    failure_modes: [control, amalgamation]
    why: >
      Control question. Stable, well-published, high-traffic. Should be correct for most councils —
      that is the point. Where it is wrong for a small or Indigenous council while correct for
      Brisbane, the differential is the finding. Also catches amalgamation confusion.
    ground_truth_hint: "council / mayor / councillors page"

# Scoring categories used by grade.py and validate.py — keep these identical in both.
verdicts:
  correct:            "Matches the council's published information."
  wrong:              "Contradicts the council's published information."
  confidently_wrong:  "Contradicts it AND is stated without hedging or caveat. Worst category."
  wrong_council:      "Describes another council's process, or a generic state/national answer."
  refused:            "Declined to answer or said it did not know. Not an error — a safe failure."
  unverifiable:       "Council's own website does not publish this. A finding, not a model error."
